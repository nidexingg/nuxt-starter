name: Bug Report
description: Report a bug to improve Nidexingg's Nuxt-Starter for everyone.
title: "[BUG]: "
labels: ["bug", "triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug! Please fill out the following sections to help us understand the issue.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we reach you if we need more information?
      placeholder: e.g. email@example.com
    validations:
      required: false

  - type: textarea
    id: current-behavior
    attributes:
      label: Current Behavior
      description: Describe what is happening.
      placeholder: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen.
      placeholder: What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to Reproduce
      description: Provide a list of steps to reproduce the bug.
      placeholder: Step 1, Step 2, ...
    validations:
      required: true

  - type: dropdown
    id: version
    attributes:
      label: Version
      description: Which version of the software are you using?
      options:
        - v1.0.0 (LTS/Stable)
        - v1.1.0 (Latest)
        - v1.2.0 (Beta)
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct Agreement
      description: By submitting this report, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true