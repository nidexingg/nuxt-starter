name: Feature Request
description: Suggest a new feature or enhancement for the project
title: "[FEATURE REQUEST]: "
labels: ["feature", "enhancement"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for your interest in improving our project! Please fill out the following sections to help us understand your feature request.

  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we reach you if we need more information?
      placeholder: e.g. email@example.com
    validations:
      required: false

  - type: input
    id: feature-title
    attributes:
      label: Feature Title
      description: A short and descriptive title for your feature request.
      placeholder: e.g. Dark Mode
    validations:
      required: true

  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description
      description: Describe the feature you would like to see implemented.
      placeholder: What does this feature do?
    validations:
      required: true

  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain how this feature would be used and why it is important.
      placeholder: How would you use this feature?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority Level
      description: How important is this feature?
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct Agreement
      description: By submitting this request, you agree to follow our Code of Conduct.
      options:
        - label: I agree to follow this project's Code of Conduct
          required: true